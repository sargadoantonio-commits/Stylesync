name: stylesync
description: StyleSync — Flutter/Firebase barber shop experience with AR try-on and priority queue.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_app_check: ^0.3.1+7
  firebase_crashlytics: ^4.1.3
  firebase_auth: ^5.3.4
  cloud_functions: ^5.1.3
  cloud_firestore: ^5.5.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shimmer: ^3.0.0
  shared_preferences: ^2.2.0
  google_sign_in: ^6.1.0
  firebase_analytics: ^11.6.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  intl: ^0.19.0
  crypto: ^3.0.2
  uuid: ^4.1.0
  in_app_review: ^2.0.11
  camera: ^0.11.0
  permission_handler: ^11.3.1
  google_mlkit_face_detection: ^0.13.0
  image: ^4.1.3
  image_picker: ^1.0.0
  freezed_annotation: ^2.4.0
  http: ^1.1.0
  local_auth: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.5.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/haircuts/
    - assets/lottie/
    - assets/data/
  fonts:
    - family: Ethnocentric
      fonts:
        - asset: assets/fonts/Ethnocentric-Regular.otf
    # Add Orbitron and Inter assets here once available:
    # - family: Orbitron
    #   fonts:
    #     - asset: assets/fonts/Orbitron-Regular.ttf
    #     - asset: assets/fonts/Orbitron-Bold.ttf
    # - family: Inter
    #   fonts:
    #     - asset: assets/fonts/Inter-Regular.ttf
    #     - asset: assets/fonts/Inter-Medium.ttf
